<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Habit tracker demo | Rhea Manocha</title>
<style>
:root{--bg:#f6f4f0;--card:#fff;--ink:#1f2a27;--mute:#8a938f;--line:#ece8e1;--acc:#3f8f6b;--accbg:#e4f1ea}
@media (prefers-color-scheme:dark){:root{--bg:#141716;--card:#1d2220;--ink:#eef2f0;--mute:#8a958f;--line:#2a312e;--acc:#5bc08f;--accbg:#22362d}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
h1{font-size:26px;margin:0;font-weight:700;letter-spacing:-.02em}
.nav{display:flex;gap:6px;align-items:center}
.nav button{width:36px;height:36px;border-radius:18px;border:0;background:var(--card);color:var(--ink);font-size:18px;cursor:pointer}
.nav button:disabled{opacity:.3}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;margin:8px 0 12px}
.seg button{flex:1;border:0;background:none;padding:7px;border-radius:10px;font-size:14px;font-weight:600;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--accbg);color:var(--acc)}
.src{display:inline-block;vertical-align:1px;margin-left:4px;padding:1px 7px;border-radius:8px;background:var(--accbg);color:var(--acc);font-size:10.5px;font-weight:600;letter-spacing:.02em}
.sub{color:var(--mute);font-size:14px;margin:0 0 14px}
.warn{background:#fdecc8;color:#6b4a00;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .2s}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:24px 4px 8px;font-weight:600}
.card{background:var(--card);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.txt{flex:1;min-width:0}
.name{font-weight:550}
.meta{font-size:12.5px;color:var(--mute);margin-top:1px}
.mini{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--acc)}
.chk{width:30px;height:30px;border-radius:15px;border:2px solid var(--line);background:none;cursor:pointer;color:#fff;font-size:16px;line-height:1;padding:0}
.chk.on{background:var(--acc);border-color:var(--acc)}
.step{display:flex;align-items:center;gap:2px;background:var(--bg);border-radius:18px;padding:2px}
.step button{width:30px;height:30px;border-radius:15px;border:0;background:var(--card);color:var(--ink);font-size:18px;cursor:pointer;padding:0}
.step button:disabled{opacity:.3}
.step.done button.p{background:var(--acc);color:#fff}
.step span{min-width:56px;text-align:center;font-variant-numeric:tabular-nums;font-size:14px;font-weight:600}
.step.done span{color:var(--acc)}
.foot{text-align:center;color:var(--mute);font-size:12px;margin-top:22px}
.mrow{padding:13px 14px;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.streak{font-size:12.5px;color:var(--mute);white-space:nowrap}
.streak b{color:var(--acc)}
.sqs{display:grid;grid-template-columns:repeat(16,1fr);gap:3px}
.sq{aspect-ratio:1;border-radius:5px;background:var(--line)}
.sq.on{background:var(--acc)}
.sq.half{background:var(--accbg)}
.sq.f{opacity:.35}
.wks{display:flex;gap:6px;flex-wrap:wrap}
.wk{padding:5px 10px;border-radius:9px;background:var(--line);font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.wk.on{background:var(--acc);color:#fff}
.wk.half{background:var(--accbg);color:var(--acc)}
.wk.f{opacity:.35}
</style>
</head>
<body>
<main id="root"></main>
<script>
(function(){
var H=[
{id:'brush',cat:'Health',name:'Brush teeth',cad:'d',goal:2,step:1,unit:'×',note:'Twice daily'},
{id:'floss',cat:'Health',name:'Floss',cad:'d',check:1},
{id:'sunscreen',cat:'Health',name:'Sunscreen',cad:'d',check:1},
{id:'sleep',cat:'Health',name:'Sleep',cad:'d',goal:7,step:.5,unit:'h',note:'Goal 7+ hours'},
{id:'journal',cat:'Health',name:'Journal',cad:'w',goal:1,step:1,unit:'×',note:'At least once a week'},

{id:'vitamins',cat:'Nutrition',name:'Take vitamins',cad:'d',check:1},
{id:'water',cat:'Nutrition',name:'Water',cad:'d',goal:60,step:8,unit:'oz',note:'Goal 60–80 oz'},
{id:'protein',cat:'Nutrition',name:'Protein',cad:'d',goal:100,step:10,unit:'g',note:'Goal 100–115 g'},
{id:'meals',cat:'Nutrition',name:'Track meals in Nourish',cad:'d',check:1},
{id:'alcohol',cat:'Nutrition',name:'No alcohol',cad:'d',check:1},
{id:'fiber',cat:'Nutrition',name:'30g fiber',cad:'d',check:1},
{id:'fruit',cat:'Nutrition',name:'Eat fruit',cad:'d',check:1},
{id:'coffee',cat:'Nutrition',name:'No coffee before breakfast',cad:'d',check:1},

{id:'steps',cat:'Exercise',name:'Steps',cad:'d',goal:8000,step:1000,unit:'steps',note:'Goal 8,000+'},
{id:'cardio',cat:'Exercise',name:'Cardio',cad:'w',goal:3,step:1,unit:'×',note:'3 sessions a week',},
{id:'strength',cat:'Exercise',name:'Strength training',cad:'w',goal:2,step:1,unit:'×',note:'Goal 2–3 a week',max:3,},
{id:'recovery',cat:'Exercise',name:'Recovery',cad:'w',goal:2,step:1,unit:'×',note:'Yoga, sauna · goal 2–3 a week',max:3,},


{id:'hobby',cat:'Creative',name:'Creative hobby',cad:'w',goal:2,step:.5,unit:'h',note:'2 hours a week'},
{id:'spanish',cat:'Creative',name:'Spanish · 15 min',cad:'d',check:1},
{id:'reading',cat:'Creative',name:'Reading',cad:'d',goal:20,step:5,unit:'min',note:'Goal 20+ minutes'},
{id:'books',cat:'Creative',name:'Books read',cad:'y',goal:12,step:1,unit:'',note:'12 a year · via StoryGraph'}
];
var CATS=['Health','Nutrition','Exercise','Creative'];
var CADLBL={d:'today',w:'this week',m:'this month',y:'this year'};
var UNIT={d:'d',w:'wk',m:'mo'};
var seed={log:{}};
var state={log:{}};
var db=null,status='loading',loaded=false,chain=Promise.resolve();
var root=document.getElementById('root');
function pad(n){return n<10?'0'+n:''+n}
function fmt(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
var todayStr=fmt(new Date());var sel=todayStr;var view='day';var msel=todayStr.slice(0,7)+'-01';
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return fmt(d)}
function weekStart(s){var d=parse(s);var k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return fmt(d)}
function range(h,s){
 if(h.cad==='d')return [s,s];
 if(h.cad==='w'){var a=weekStart(s);return [a,addDays(a,6)]}
 if(h.cad==='m'){return [s.slice(0,7)+'-01',s.slice(0,7)+'-31']}
 return [s.slice(0,4)+'-01-01',s.slice(0,4)+'-12-31']}
var auto={}; /* sessions pulled from Strava: auto[day][habitId] = count */
function val(day,id){var m=(state.log[day]||{})[id]||0,a=(auto[day]||{})[id]||0;return Math.max(m,a)}
function dayKeys(){var seen={};Object.keys(state.log).forEach(function(k){seen[k]=1});Object.keys(auto).forEach(function(k){seen[k]=1});return Object.keys(seen)}
function total(h,s){var r=range(h,s),t=0;dayKeys().forEach(function(k){if(k>=r[0]&&k<=r[1])t+=val(k,h.id)});return t}
function isDone(h,s){return total(h,s)>=(h.check?1:h.goal)}
function num(x){return x>=1000?Math.round(x).toLocaleString('en-US'):(Math.round(x*10)/10).toString()}
function byId(id){return H.filter(function(x){return x.id===id})[0]}

/* ---------- saving (db) ---------- */
function enqueue(op){
 status='saving';
 chain=chain.then(op).then(function(){if(status==='saving'){status='saved';paintStatus()}}).catch(function(){status='error';paintStatus()})}
function paintStatus(){var el=document.getElementById('st');if(el)el.textContent=statusText()}
function statusText(){return '';return status==='saved'?'Saved':status==='saving'?'Saving…':status==='error'?'Couldn’t save — check your connection':status==='slow'?'Loading is taking a while…':status==='loading'?'Loading…':''}
function saveLocal(){try{localStorage.setItem('habits-demo',JSON.stringify(state.log))}catch(e){}}
function sample(){
 var log={},seedv=7;function r(){seedv=(seedv*9301+49297)%233280;return seedv/233280}
 for(var k=1;k<=34;k++){var d=addDays(todayStr,-k),day={};
  H.forEach(function(h){
   if(h.cad!=='d')return;
   if(h.check){if(r()<.72)day[h.id]=1}
   else{var v=h.goal*(0.6+r()*0.6);day[h.id]=Math.round(v/h.step)*h.step}
  });
  if(new Date(parse(d)).getDay()%3===1){day.cardio=1}
  if(new Date(parse(d)).getDay()===2){day.strength=1}
  if(new Date(parse(d)).getDay()===0){day.recovery=1}
  if(new Date(parse(d)).getDay()===5){day.hobby=1}
  log[d]=day}
 return log}
async function init(){
 var saved=null;try{saved=JSON.parse(localStorage.getItem('habits-demo')||'null')}catch(e){}
 state.log=saved||sample();status='demo';loaded=true;render()}

function change(id,delta){
 var h=byId(id);
 var day=Object.assign({},state.log[sel]||{});
 var base=delta>0?Math.max(day[id]||0,(auto[sel]||{})[id]||0):(day[id]||0);
 var v=base+delta;if(v<0)v=0;
 if(h.check)v=(day[id]?0:1);
 if(v===0)delete day[id];else day[id]=Math.round(v*10)/10;
 var key=sel;
 if(!Object.keys(day).length){delete state.log[key];saveLocal()}
 else{state.log[key]=day;saveLocal()}
 render()}

/* ---------- streaks ---------- */
function earliest(){var k=dayKeys().sort();return k.length?k[0]:todayStr}
function prevP(h,s){
 if(h.cad==='d')return addDays(s,-1);
 if(h.cad==='w')return addDays(s,-7);
 var d=parse(s.slice(0,7)+'-01');d.setMonth(d.getMonth()-1);return fmt(d)}
function streaks(h){
 var e=earliest(),flags=[],c=todayStr,n=0;
 while(range(h,c)[1]>=e&&n++<800){flags.push(isDone(h,c));c=prevP(h,c)}
 var cur=0,i=flags[0]?0:1;
 while(i<flags.length&&flags[i]){cur++;i++}
 var best=0,run=0;
 flags.forEach(function(f){run=f?run+1:0;if(run>best)best=run});
 return {cur:cur,best:best}}

/* ---------- views ---------- */
function badge(h){return '';
 if(h.src==='strava')return ' <span class="src" title="Synced automatically from Strava">⟳ Strava</span>';
 if(h.src==='health')return ' <span class="src" title="Synced from Apple Health when you ask Claude to sync">♥ Health</span>';
 return ''}
function tabs(){return '<div class="seg"><button data-view="day"'+(view==='day'?' class="on"':'')+'>Day</button><button data-view="month"'+(view==='month'?' class="on"':'')+'>Month</button></div>'}
function banner(){return '<div class="warn">Demo with sample data. Tap to log; entries save only in this browser. <a href="../../#lab" style="color:inherit">Back to Rhea\'s portfolio</a></div>'}
var stravaStatus='';
function stravaText(){
 var m={syncing:'Syncing Strava…',ok:'Strava synced',none:'',needs_reauth:'Reconnect Strava in Claude settings → Connectors',server_not_connected:'Add Strava in Claude settings → Connectors',not_in_manifest:'Strava access was declined for this page',error:'Strava sync failed'};
 return m[stravaStatus]||''}
function foot(t){return '<p class="foot"><span id="st">'+statusText()+'</span>'+(stravaText()?' · '+stravaText():'')+(stravaStatus&&stravaStatus!=='syncing'?' · <button data-sync="1" style="all:unset;text-decoration:underline;cursor:pointer">Sync now</button>':'')+(t?'<br>'+t:'')+'</p>'}

/* Strava → cardio / strength / recovery */
var SPORT={Run:'cardio',TrailRun:'cardio',VirtualRun:'cardio',Ride:'cardio',VirtualRide:'cardio',MountainBikeRide:'cardio',GravelRide:'cardio',EBikeRide:'cardio',Swim:'cardio',Rowing:'cardio',VirtualRow:'cardio',Elliptical:'cardio',StairStepper:'cardio',Hike:'cardio',HighIntensityIntervalTraining:'cardio',WeightTraining:'strength',Crossfit:'strength',Yoga:'recovery',Pilates:'recovery'};
async function syncStrava(){}

function renderDay(){
 var d=parse(sel),isToday=sel===todayStr;
 var title=isToday?'Today':d.toLocaleDateString(undefined,{weekday:'long'});
 var dailies=H.filter(function(h){return h.cad==='d'});
 var done=dailies.filter(function(h){return isDone(h,sel)}).length;
 var html='<header><h1>'+title+'</h1><div class="nav"><button data-nav="-1" aria-label="Previous day">‹</button><button data-nav="1" aria-label="Next day"'+(isToday?' disabled':'')+'>›</button></div></header>';
 html+=tabs()+banner();
 html+='<p class="sub">'+d.toLocaleDateString(undefined,{month:'long',day:'numeric'})+' · '+done+' of '+dailies.length+' daily habits done</p>';
 html+='<div class="bar"><i style="width:'+Math.round(done/dailies.length*100)+'%"></i></div>';
 CATS.forEach(function(c){
  html+='<h2>'+c+'</h2><div class="card">';
  H.filter(function(h){return h.cat===c}).forEach(function(h){
   var t=total(h,sel),day=val(sel,h.id),manual=(state.log[sel]||{})[h.id]||0,fromStrava=(auto[sel]||{})[h.id]||0;
   if(h.check){
    var on=t>=1;
    html+='<div class="row"><div class="txt"><div class="name">'+h.name+badge(h)+'</div>'+(h.note?'<div class="meta">'+h.note+'</div>':'')+'</div><button class="chk'+(on?' on':'')+'" data-t="'+h.id+'" aria-label="Toggle '+h.name+'">'+(on?'✓':'')+'</button></div>';
   }else{
    var ok=t>=h.goal,pct=Math.min(100,t/h.goal*100);
    var u=h.unit&&h.unit!=='×'?' '+h.unit:'';
    var shown=num(t)+u;
    var goalTxt=num(h.goal)+(h.max?'–'+h.max:'')+u;
    html+='<div class="row"><div class="txt"><div class="name">'+h.name+badge(h)+'</div><div class="meta">'+shown+' of '+goalTxt+' '+CADLBL[h.cad]+(fromStrava?' · incl. Strava':'')+'</div><div class="mini"><i style="width:'+pct+'%"></i></div></div>'+
     '<div class="step'+(ok?' done':'')+'"><button data-m="'+h.id+'"'+(manual<=0?' disabled':'')+' aria-label="Remove">−</button><span>'+num(h.cad==='d'?t:day)+'</span><button class="p" data-p="'+h.id+'" aria-label="Add">+</button></div></div>';
   }
  });
  html+='</div>';
 });
 html+=foot('Weeks run Mon–Sun · + / − log to the day shown');
 root.innerHTML=html}

function renderMonth(){
 var md=parse(msel),ym=msel.slice(0,7);
 var lastD=new Date(md.getFullYear(),md.getMonth()+1,0),last=fmt(lastD),nd=lastD.getDate();
 var isCur=ym===todayStr.slice(0,7);
 var dailies=H.filter(function(h){return h.cad==='d'});
 var possible=0,doneN=0;
 for(var i=1;i<=nd;i++){var s=ym+'-'+pad(i);if(s>todayStr)break;dailies.forEach(function(h){possible++;if(isDone(h,s))doneN++})}
 var pct=possible?Math.round(doneN/possible*100):0;
 var html='<header><h1>'+md.toLocaleDateString(undefined,{month:'long',year:'numeric'})+'</h1><div class="nav"><button data-mnav="-1" aria-label="Previous month">‹</button><button data-mnav="1" aria-label="Next month"'+(isCur?' disabled':'')+'>›</button></div></header>';
 html+=tabs()+banner();
 html+='<p class="sub">'+pct+'% of daily habits completed</p><div class="bar"><i style="width:'+pct+'%"></i></div>';
 CATS.forEach(function(c){
  html+='<h2>'+c+'</h2><div class="card">';
  H.filter(function(h){return h.cat===c}).forEach(function(h){
   var st=h.cad==='y'?null:streaks(h);
   var stTxt='';
   if(st&&(st.best>0))stTxt='<span class="streak">🔥 <b>'+st.cur+UNIT[h.cad]+'</b> · best '+st.best+UNIT[h.cad]+'</span>';
   var body='';
   if(h.cad==='d'){
    body='<div class="sqs">';
    for(var j=1;j<=nd;j++){
     var s2=ym+'-'+pad(j),t=total(h,s2),cls=s2>todayStr?' f':(isDone(h,s2)?' on':(t>0?' half':''));
     body+='<i class="sq'+cls+'" title="'+s2+'"></i>'}
    body+='</div>';
   }else if(h.cad==='w'){
    body='<div class="wks">';
    var ws=weekStart(ym+'-01');
    while(ws<=last){
     var tw=total(h,ws),cl=ws>todayStr?' f':(tw>=h.goal?' on':(tw>0?' half':''));
     body+='<span class="wk'+cl+'" title="Week of '+ws+'">'+num(tw)+'/'+num(h.goal)+'</span>';
     ws=addDays(ws,7)}
    body+='</div>';
   }else if(h.cad==='m'){
    var tm=total(h,msel);
    body='<div class="wks"><span class="wk'+(tm>=h.goal?' on':'')+'">'+num(tm)+'/'+num(h.goal)+' this month</span></div>';
   }else{
    var ty=total(h,msel);
    body='<div class="mini" style="margin-top:0"><i style="width:'+Math.min(100,ty/h.goal*100)+'%"></i></div><div class="meta">'+num(ty)+' of '+h.goal+' in '+md.getFullYear()+'</div>';
   }
   html+='<div class="mrow"><div class="mhead"><div class="name">'+h.name+badge(h)+'</div>'+stTxt+'</div>'+body+'</div>';
  });
  html+='</div>';
 });
 html+=foot('🔥 = current streak (days, or weeks for weekly habits) · light green = partly done');
 root.innerHTML=html}

function render(){if(view==='month')renderMonth();else renderDay()}

root.addEventListener('click',function(e){
 var b=e.target.closest('button');if(!b)return;
 if(b.dataset.sync){syncStrava();return}
 if(b.dataset.view){view=b.dataset.view;render();return}
 if(b.dataset.mnav){var d=parse(msel);d.setMonth(d.getMonth()+(+b.dataset.mnav));var n=fmt(d);if(n.slice(0,7)<=todayStr.slice(0,7)){msel=n;render()}return}
 if(b.dataset.nav){var n2=addDays(sel,+b.dataset.nav);if(n2<=todayStr){sel=n2;render()}return}
 if(b.dataset.t)return change(b.dataset.t,1);
 if(b.dataset.p){var h=byId(b.dataset.p);return change(h.id,h.step)}
 if(b.dataset.m){var h2=byId(b.dataset.m);return change(h2.id,-h2.step)}
});
render();
init();
})();
</script>
</body>
</html>
