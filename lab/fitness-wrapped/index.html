<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fitness Wrapped | Rhea Manocha</title>
<meta name="description" content="An animated year-in-review for training data, in the spirit of the music apps' yearly recaps. Shown here with sample data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html{scroll-snap-type:y mandatory}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#16131F;background:#16131F}
.s{min-height:100vh;min-height:100svh;scroll-snap-align:start;display:flex;flex-direction:column;justify-content:center;padding:max(8vh,56px) clamp(24px,8vw,120px);position:relative;overflow:hidden}
.s h2,.s .big,.s .lab{font-family:'Bricolage Grotesque',sans-serif}
.lab{font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:14px;margin:0 0 20px}
.big{font-weight:800;letter-spacing:-.05em;line-height:.86;margin:0;font-size:clamp(88px,22vw,260px);font-variant-numeric:tabular-nums}
.unit{font:800 clamp(28px,5vw,56px)/1 'Bricolage Grotesque',sans-serif;letter-spacing:-.03em;margin:12px 0 0}
.sub{font-size:clamp(16px,2vw,22px);max-width:560px;margin:22px 0 0}
.a{background:#D7F25A}.b{background:#5B3DF5;color:#fff}.c{background:#16131F;color:#D7F25A}.d{background:#FF7A59}.e{background:#EAE6FF}.f{background:#D7F25A}
.s .in{opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform .7s ease}
.s.on .in{opacity:1;transform:none}
.s.on .in:nth-child(2){transition-delay:.12s}.s.on .in:nth-child(3){transition-delay:.24s}.s.on .in:nth-child(4){transition-delay:.36s}
.bars{display:flex;align-items:flex-end;gap:clamp(4px,1.2vw,12px);height:clamp(160px,34vh,300px);margin-top:24px}
.bars i{flex:1;background:#16131F;border-radius:8px 8px 0 0;height:0;transition:height 1s cubic-bezier(.2,.8,.2,1)}
.s.on .bars i{height:var(--h)}.bars i.top{background:#fff}
.mo{display:flex;gap:clamp(4px,1.2vw,12px);margin-top:8px;font:600 12px Inter}.mo span{flex:1;text-align:center}
.top3{list-style:none;margin:20px 0 0;padding:0;max-width:640px}
.top3 li{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid #16131F;padding:10px 0;font:800 clamp(26px,4.4vw,48px)/1.1 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}
.top3 li span{font:600 18px Inter}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:24px;max-width:640px}
.week div{display:flex;flex-direction:column;align-items:center;gap:8px;font:600 13px Inter}
.week i{width:100%;aspect-ratio:1;border-radius:12px;background:#16131F;opacity:var(--o)}
.hint{position:absolute;bottom:22px;left:0;right:0;text-align:center;font:600 13px Inter;opacity:.7}
.note{position:fixed;top:12px;right:12px;z-index:9;background:#fff;color:#16131F;border-radius:999px;padding:8px 14px;font:600 12px Inter;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.back{position:fixed;top:12px;left:12px;z-index:9;background:#16131F;color:#D7F25A;border-radius:999px;padding:9px 15px;font:600 13px Inter;text-decoration:none;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.share{margin-top:28px;display:inline-block;background:#16131F;color:#D7F25A;border:0;border-radius:999px;padding:16px 26px;font:800 17px 'Bricolage Grotesque',sans-serif;cursor:pointer;text-decoration:none;align-self:flex-start}
@media(prefers-reduced-motion:reduce){.s .in,.bars i{transition:none}html{scroll-snap-type:none}}
@media(max-width:480px){.note{display:none}}
</style>
</head>
<body>
<a class="back" href="../../#lab">&larr; Rhea Manocha</a>
<div class="note">Sample data</div>

<section class="s a"><p class="lab in">Fitness Wrapped</p><h2 class="big in" id="yr">2026</h2><p class="unit in">in motion.</p><p class="sub in" id="intro"></p><div class="hint">Scroll</div></section>

<section class="s b"><p class="lab in">Time moving</p><div class="big in" data-n="hours">0</div><p class="unit in">hours of training</p><p class="sub in" id="hrsub"></p></section>

<section class="s c"><p class="lab in" style="color:#fff">Distance</p><div class="big in" data-n="miles">0</div><p class="unit in">miles on your own power</p><p class="sub in" style="color:#fff" id="misub"></p></section>

<section class="s d"><p class="lab in">Your mix</p><ol class="top3 in" id="mix"></ol><p class="sub in" id="mixsub"></p></section>

<section class="s e"><p class="lab in">Month by month</p><h2 class="unit in" id="peak" style="margin:0"></h2><div class="bars in" id="bars"></div><div class="mo in" id="mo"></div></section>

<section class="s f"><p class="lab in">Your rhythm</p><h2 class="unit in" id="day" style="margin:0"></h2><div class="week in" id="week"></div><p class="sub in" id="streak"></p><a class="share in" href="../../#lab">Back to the lab</a></section>

<script>
// Sample data. Swap this object for real totals and every slide updates.
const D={year:2026,activities:312,hours:287,miles:1486,
 mix:[["Run",118,"runs"],["Ride",74,"rides"],["Strength",66,"sessions"]],
 months:[18,20,26,31,29,27,33,30,24,28,26,20],
 weekdays:[3,5,2,4,3,6,5],longest:19};
const M=['J','F','M','A','M','J','J','A','S','O','N','D'],W=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const $=id=>document.getElementById(id);
$('yr').textContent=D.year;
$('intro').textContent=D.activities+' activities, one very busy year. Here is how it added up. (Sample data.)';
$('hrsub').textContent='That is about '+(D.hours/24).toFixed(1)+' full days of moving.';
$('misub').textContent='Roughly '+Math.round(D.miles/26.2)+' marathons back to back.';
$('mix').innerHTML=D.mix.map(m=>`<li>${m[0]} <span>${m[1]} ${m[2]}</span></li>`).join('');
$('mixsub').textContent='Your top sport was '+D.mix[0][0].toLowerCase()+'ning at '+Math.round(D.mix[0][1]/D.activities*100)+'% of everything you logged.'.replace('runninging','running');
const mx=Math.max(...D.months),pk=D.months.indexOf(mx);
const full=['January','February','March','April','May','June','July','August','September','October','November','December'];
$('peak').textContent=full[pk]+' was your biggest month, with '+mx+' activities.';
$('bars').innerHTML=D.months.map((v,i)=>`<i class="${i===pk?'top':''}" style="--h:${Math.round(v/mx*100)}%" title="${full[i]}: ${v}"></i>`).join('');
$('mo').innerHTML=M.map(m=>`<span>${m}</span>`).join('');
const wm=Math.max(...D.weekdays),wk=D.weekdays.indexOf(wm);
$('day').textContent=W[wk]+' is your day.';
$('week').innerHTML=D.weekdays.map((v,i)=>`<div><i style="--o:${(0.18+0.82*v/wm).toFixed(2)}"></i>${W[i]}</div>`).join('');
$('streak').textContent='Your longest streak was '+D.longest+' days in a row.';
// reveal + count-up
const fmt=n=>Math.round(n).toLocaleString('en-US');
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&!e.target.classList.contains('on')){e.target.classList.add('on');e.target.querySelectorAll('[data-n]').forEach(el=>{const to=D[el.dataset.n],t0=performance.now(),d=1400;const r=window.matchMedia('(prefers-reduced-motion: reduce)').matches;(function f(t){const k=r?1:Math.min(1,(t-t0)/d);el.textContent=fmt(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(t0)})}}),{threshold:.45});
document.querySelectorAll('.s').forEach(s=>io.observe(s));
</script>
</body>
</html>
